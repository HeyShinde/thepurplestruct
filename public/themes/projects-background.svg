<?xml version="1.0" encoding="UTF-8"?>
<svg width='220' height='220' viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'>
  <rect width='220' height='220' fill='none'/>
  <text x='20' y='40' font-size='22' fill='#a78bfa' fill-opacity='0.35' font-family='monospace' class='bounce-bg'>0</text>
  <text x='60' y='60' font-size='22' fill='#a78bfa' fill-opacity='0.35' font-family='monospace' class='animated-bg-reverse'>1</text>
  <text x='100' y='30' font-size='22' fill='#a78bfa' fill-opacity='0.3' font-family='monospace' class='bounce-bg'>0</text>
  <text x='180' y='80' font-size='22' fill='#a78bfa' fill-opacity='0.3' font-family='monospace' class='animated-bg-reverse'>1</text>
  <!-- Robot Icon -->
  <g transform='translate(30,120) scale(1.2)' class='animated-bg'>
    <rect x='8' y='8' width='24' height='24' rx='6' fill='#a78bfa' fill-opacity='0.23'/>
    <rect x='14' y='18' width='12' height='8' rx='2' fill='#a78bfa' fill-opacity='0.3'/>
    <circle cx='14' cy='16' r='2' fill='#a78bfa' fill-opacity='0.35'/>
    <circle cx='22' cy='16' r='2' fill='#a78bfa' fill-opacity='0.35'/>
    <rect x='18' y='28' width='4' height='6' rx='1' fill='#a78bfa' fill-opacity='0.3'/>
  </g>
  <!-- Laptop Icon -->
  <g transform='translate(140,150) scale(1.1)' class='bounce-bg'>
    <rect x='0' y='8' width='28' height='16' rx='3' fill='#a78bfa' fill-opacity='0.23'/>
    <rect x='4' y='12' width='20' height='8' rx='1.5' fill='#000' fill-opacity='0.3'/>
    <text x='7' y='20' font-size='7' fill='#a78bfa' fill-opacity='0.45' font-family='monospace'>01 10</text>
  </g>
  <!-- More scattered binary -->
